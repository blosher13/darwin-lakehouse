[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "darwin-lakehouse"
version = "1.0.0"
description = "Real-time UK rail data platform: National Rail Darwin -> Kafka -> Databricks Delta (medallion) -> Power BI"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "stomp.py>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "jsonschema>=4.18"]   # jsonschema: powerbi/validate_pbir.py
preview = ["matplotlib>=3.8"]                              # powerbi/render_preview.py

[project.scripts]
darwin-setup = "darwin_lakehouse.setup_workspace:main"
darwin-deploy-pipeline = "darwin_lakehouse.deploy_pipeline:main"
darwin-reference-sync = "darwin_lakehouse.reference.sync:main"
darwin-feed-monitor = "darwin_lakehouse.feed_monitor:main"

[tool.hatch.build.targets.wheel]
packages = ["src/darwin_lakehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Databricks injects `spark` into pipeline source files
"pipelines/*.py" = ["F821"]
